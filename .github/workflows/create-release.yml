name: Create Release from Tag

on:
    push:
        tags:
            - "v*.*.*" # Matches semantic versioning tags like v1.0.0
            - "v*.*.*-*" # Matches pre-release tags like v1.0.0-beta

env:
    PROJECT_NAME: CE-RISE DP System GitOps Template
    PRIMARY_REPO_URL: https://codeberg.org/CE-RISE-software/dp-system-gitops-template
    DOCUMENTATION_URL: https://ce-rise-software.codeberg.page/dp-system-gitops-template/

jobs:
    create-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write # Required for creating releases

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Fetch all history for changelog generation

            - name: Extract tag name
              id: tag
              run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

            - name: Check if release exists
              id: check_release
              run: |
                  if gh release view "${{ steps.tag.outputs.TAG_NAME }}" >/dev/null 2>&1; then
                    echo "EXISTS=true" >> $GITHUB_OUTPUT
                  else
                    echo "EXISTS=false" >> $GITHUB_OUTPUT
                  fi
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate Release Notes
              id: notes
              if: steps.check_release.outputs.EXISTS == 'false'
              env:
                  RELEASE_TAG: ${{ steps.tag.outputs.TAG_NAME }}
              run: |
                  {
                      printf '## %s %s\n\n' "$PROJECT_NAME" "$RELEASE_TAG"
                      python3 scripts/extract_release_notes.py "$RELEASE_TAG"
                      printf '\n---\n\nCanonical source: %s\n\nDocumentation: %s\n' "$PRIMARY_REPO_URL" "$DOCUMENTATION_URL"
                  } > release_notes.md

            - name: Create GitHub Release
              if: steps.check_release.outputs.EXISTS == 'false'
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ steps.tag.outputs.TAG_NAME }}
                  name: Release ${{ steps.tag.outputs.TAG_NAME }}
                  body_path: release_notes.md
                  draft: false
                  prerelease: ${{ contains(steps.tag.outputs.TAG_NAME, '-') }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
